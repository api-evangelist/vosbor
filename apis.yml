aid: vosbor
name: Vosbor
description: >-
  Vosbor is a digital trading platform for bulk agricultural commodities,
  headquartered in Amsterdam with offices in Singapore and Shanghai. Founded in
  2019 and backed by Lux Capital, its exchange lets trading firms and end users
  trade corn, wheat, soybean, palm oil and other grains and oilseeds in spot
  and forward markets, with integrated KYC, encrypted trade data, straight-through
  processing, and a WhatsApp AI broker that negotiates with multiple
  counterparties simultaneously. Market data is downloadable in CSV, and the
  company advertises data access through an API for customers, but publishes no
  public developer portal or API documentation.
